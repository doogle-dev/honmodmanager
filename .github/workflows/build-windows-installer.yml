name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build:win -- --publish never
      - id: appversion
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$version" | grep -q v; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hon-reborn-mod-manager-windows-setup
          path: |
            app/dist/*.exe
            app/dist/*.blockmap
            app/dist/latest.yml
          if-no-files-found: error
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        if: startsWith(github.ref, 'refs/tags/v') || steps.appversion.outputs.released == 'false'
        with:
          tag_name: v${{ steps.appversion.outputs.version }}
          files: |
            app/dist/*.exe
            app/dist/*.blockmap
            app/dist/latest.yml
          fail_on_unmatched_files: true
