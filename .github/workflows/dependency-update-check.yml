name: Dependency Update Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx electron-vite build

  merge:
    needs: check
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: dependency-auto-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a
      - id: merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --squash "$PULL_REQUEST_URL"
          echo "merged=true" >> "$GITHUB_OUTPUT"
      - id: shipped
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/${{ github.repository }}/contents/app/package-lock.json?ref=$BASE_SHA" > lock-before.json
          gh api -H "Accept: application/vnd.github.raw" "repos/${{ github.repository }}/contents/app/package-lock.json?ref=$HEAD_SHA" > lock-after.json
          node -e '
            const fs = require("fs");
            const packagesBefore = JSON.parse(fs.readFileSync("lock-before.json", "utf8")).packages;
            const packagesAfter = JSON.parse(fs.readFileSync("lock-after.json", "utf8")).packages;
            const isShipped = (packageKey, packageEntry) => packageKey === "node_modules/electron" || !packageEntry.dev;
            const changedShippedPackages = Object.keys({ ...packagesBefore, ...packagesAfter }).filter((packageKey) => {
              if (packageKey === "") return false;
              const versionBefore = (packagesBefore[packageKey] || {}).version;
              const versionAfter = (packagesAfter[packageKey] || {}).version;
              return versionBefore !== versionAfter && isShipped(packageKey, packagesAfter[packageKey] || packagesBefore[packageKey]);
            });
            console.log("Shipped packages changed: " + (changedShippedPackages.join(" ") || "none"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "changed=" + (changedShippedPackages.length > 0) + "\n");
          '
      - if: steps.shipped.outputs.changed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - if: steps.shipped.outputs.changed == 'true'
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          releaseVersion=$(node -p "require('./package.json').version")
          git commit -am "release: $releaseVersion with automatic dependency updates"
          git push origin HEAD:main
          gh workflow run build-windows-installer.yml --ref main
